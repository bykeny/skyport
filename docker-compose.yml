services:
  db-flight-scheduling:
    image: postgres:16
    container_name: db-flight-scheduling
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      POSTGRES_DB: flight_scheduling
    ports:
      - "5432:5432"
    volumes:
      - db-flight-scheduling-data:/var/lib/postgresql/data

  db-gate-management:
    image: postgres:16
    container_name: db-gate-management
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      POSTGRES_DB: gate_management
    ports:
      - "5433:5432"
    volumes:
      - db-gate-management-data:/var/lib/postgresql/data
    
  db-security-clearance:
    image: postgres:16
    container_name: db-security-clearance
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      POSTGRES_DB: security_clearance
    ports:
      - "5438:5432"
    volumes:
      - db-security-clearance-data:/var/lib/postgresql/data

  db-passenger-checkin:
    image: postgres:16
    container_name: db-passenger-checkin
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      POSTGRES_DB: passenger_checkin
    ports:
      - "5434:5432"
    volumes:
      - db-passenger-checkin-data:/var/lib/postgresql/data

  db-baggage-tracking:
    image: postgres:16
    container_name: db-baggage-tracking
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      POSTGRES_DB: baggage_tracking
    ports:
      - "5435:5432"
    volumes:
      - db-baggage-tracking-data:/var/lib/postgresql/data

  db-retail-dutyfree:
    image: postgres:16
    container_name: db-retail-dutyfree
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      POSTGRES_DB: retail_dutyfree
    ports:
      - "5436:5432"
    volumes:
      - db-retail-dutyfree-data:/var/lib/postgresql/data

  db-notification:
    image: postgres:16
    container_name: db-notification
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      POSTGRES_DB: notification
    ports:
      - "5437:5432"
    volumes:
      - db-notification-data:/var/lib/postgresql/data

  db-auth:
    image: postgres:16
    container_name: db-auth
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      POSTGRES_DB: auth_service
    ports:
      - "5439:5432"
    volumes:
      - db-auth-data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  api-gateway:
    image: maven:3.9-eclipse-temurin-21
    container_name: api-gateway
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - auth-service
      - flight-scheduling-service
      - gate-management-service
      - passenger-checkin-service
      - baggage-tracking-service
      - retail-dutyfree-service
      - notification-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-dev-auth-secret-change-me-32-bytes-min}
    volumes:
      - ./backend/api-gateway:/workspace
      - api-gateway-maven-cache:/root/.m2
    command: mvn spring-boot:run

  flight-scheduling-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: flight-scheduling-service
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - db-flight-scheduling
      - kafka
    environment:
      FLIGHT_DB_URL: jdbc:postgresql://db-flight-scheduling:5432/flight_scheduling
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "8081:8081"
    volumes:
      - ./backend/flight-scheduling-service:/workspace
      - flight-scheduling-maven-cache:/root/.m2
    command: mvn spring-boot:run

  gate-management-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: gate-management-service
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - db-gate-management
      - kafka
    environment:
      GATE_DB_URL: jdbc:postgresql://db-gate-management:5432/gate_management
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "8082:8082"
    volumes:
      - ./backend/gate-management-service:/workspace
      - gate-management-maven-cache:/root/.m2
    command: mvn spring-boot:run

  passenger-checkin-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: passenger-checkin-service
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - db-passenger-checkin
      - flight-scheduling-service
      - kafka
    environment:
      CHECKIN_DB_URL: jdbc:postgresql://db-passenger-checkin:5432/passenger_checkin
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      KAFKA_BOOTSTRAP: kafka:29092
      FLIGHT_SCHEDULING_URL: http://flight-scheduling-service:8081
      FLIGHT_VALIDATION_ENABLED: ${FLIGHT_VALIDATION_ENABLED:-true}
    ports:
      - "8083:8083"
    volumes:
      - ./backend/passenger-checkin-service:/workspace
      - passenger-checkin-maven-cache:/root/.m2
    command: mvn spring-boot:run

  baggage-tracking-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: baggage-tracking-service
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - db-baggage-tracking
      - kafka
    environment:
      BAGGAGE_DB_URL: jdbc:postgresql://db-baggage-tracking:5432/baggage_tracking
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "8084:8084"
    volumes:
      - ./backend/baggage-tracking-service:/workspace
      - baggage-tracking-maven-cache:/root/.m2
    command: mvn spring-boot:run

  notification-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: notification-service
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - db-notification
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://db-notification:5432/notification
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "8086:8086"
    volumes:
      - ./backend/notification-service:/workspace
      - notification-maven-cache:/root/.m2
    command: mvn spring-boot:run

  retail-dutyfree-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: retail-dutyfree-service
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - db-retail-dutyfree
      - passenger-checkin-service
    environment:
      RETAIL_DB_URL: jdbc:postgresql://db-retail-dutyfree:5432/retail_dutyfree
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      PASSENGER_CHECKIN_URL: http://passenger-checkin-service:8083
      CHECKIN_VALIDATION_ENABLED: ${CHECKIN_VALIDATION_ENABLED:-true}
    ports:
      - "8085:8085"
    volumes:
      - ./backend/retail-dutyfree-service:/workspace
      - retail-dutyfree-maven-cache:/root/.m2
    command: mvn spring-boot:run

  security-clearance-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: security-clearance-service
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - db-security-clearance
      - kafka
    environment:
      SECURITY_DB_URL: jdbc:postgresql://db-security-clearance:5432/security_clearance
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "8087:8087"
    volumes:
      - ./backend/security-clearance-service:/workspace
      - security-clearance-maven-cache:/root/.m2
    command: mvn spring-boot:run

  auth-service:
    image: maven:3.9-eclipse-temurin-21
    container_name: auth-service
    profiles:
      - apps
    working_dir: /workspace
    depends_on:
      - db-auth
    environment:
      AUTH_DB_URL: jdbc:postgresql://db-auth:5432/auth_service
      POSTGRES_USER: ${POSTGRES_USER:-airport_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airport_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-auth-secret-change-me-32-bytes-min}
    ports:
      - "8088:8088"
    volumes:
      - ./backend/auth-service:/workspace
      - auth-service-maven-cache:/root/.m2
    command: mvn spring-boot:run

  frontend:
    image: node:20-alpine
    container_name: airport-frontend
    profiles:
      - apps
    working_dir: /app
    depends_on:
      - passenger-checkin-service
      - retail-dutyfree-service
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_TARGET: http://api-gateway:8080
    command: sh -c "npm install; npm run dev -- --host"

volumes:
  db-flight-scheduling-data:
  db-gate-management-data:
  db-passenger-checkin-data:
  db-baggage-tracking-data:
  db-security-clearance-data:
  db-retail-dutyfree-data:
  db-notification-data:
  db-auth-data:
  api-gateway-maven-cache:
  flight-scheduling-maven-cache:
  gate-management-maven-cache:
  security-clearance-maven-cache:
  passenger-checkin-maven-cache:
  notification-maven-cache:
  retail-dutyfree-maven-cache:
  auth-service-maven-cache:
  baggage-tracking-maven-cache:
